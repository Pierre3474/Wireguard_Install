name: Garde-fou

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  mentions:
    name: Mentions interdites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fichiers, noms de fichiers et messages de commit
        run: |
          # motif encodé pour ne pas apparaître en clair dans le dépôt
          motif=$(echo 'Y2xhdWRlfGFudGhyb3BpYw==' | base64 -d)
          echec=0
          if git grep -n -i -E "$motif" -- . ':!.github/workflows/garde-fou.yml'; then
            echo "::error::Mention interdite dans les fichiers"
            echec=1
          fi
          if git ls-files | grep -i -E "$motif"; then
            echo "::error::Mention interdite dans un nom de fichier"
            echec=1
          fi
          if git log --format='%an %ae %cn %ce%n%B' | grep -i -E "$motif"; then
            echo "::error::Mention interdite dans l'historique des commits"
            echec=1
          fi
          exit $echec

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shell (shellcheck, erreurs)
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -S error
